name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon (macos-14) and Intel (macos-13) are both validated;
        # Renderset shipped a 2.0.1 bug specific to M-series Mac, so M-series
        # CI is non-negotiable.
        os: [ubuntu-latest, macos-13, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate Python syntax
        run: python -m compileall -q stage

      - name: Validate manifest
        shell: python
        run: |
          import tomllib
          import pathlib
          path = pathlib.Path("stage/blender_manifest.toml")
          data = tomllib.loads(path.read_text())
          required = {
              "schema_version", "id", "version", "name", "tagline",
              "maintainer", "type", "blender_version_min", "license",
          }
          missing = required - set(data)
          if missing:
              raise SystemExit(f"Manifest missing required keys: {sorted(missing)}")
          print(f"OK: {data['name']} v{data['version']} for Blender {data['blender_version_min']}+")

      - name: Build extension package
        run: python scripts/package.py

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage-${{ matrix.os }}
          path: build/*.zip
          retention-days: 7

